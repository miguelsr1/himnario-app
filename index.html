<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Himnario</title>
    <link rel="stylesheet" href="styles.css">
    <!-- Using Google Fonts for Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>

<body>

    <!-- SEARCH INTERFACE -->
    <div id="search-container" class="active-view">
        <div class="search-box">
            <input type="text" id="search-input" placeholder="Buscar himno por título, número o letra..." autofocus>
        </div>
        <div id="results-list" class="results-list">
            <!-- Results will be injected here -->
        </div>
    </div>

    <!-- PRESENTATION INTERFACE -->
    <div id="presentation-container" class="hidden-view">

        <!-- HEADER -->
        <header class="presentation-header">
            <div class="header-icon">
                <img src="./assets/logo.jpg" alt="Back" style="width: 64px; height: 64px;">
            </div>
            <div class="header-text">
                <h1 id="slide-title">TÍTULO DEL HIMNO</h1>
            </div>
            <div class="header-spacer">
                <h2 id="slide-subtitle" style="text-align: center;">HIMNO 000</h2>
            </div> <!-- For balance -->
        </header>

        <!-- MAIN CONTENT AREA -->
        <main class="presentation-main">
            <!-- LEFT ARROW -->
            <button id="btn-prev" class="nav-arrow left">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="15 18 9 12 15 6"></polyline>
                </svg>
            </button>

            <!-- LYRICS CONTAINER -->
            <div class="lyrics-container">
                <div id="slide-badge" class="badge">ESTROFA 1</div>
                <div id="slide-content" class="slide-content">
                    <!-- Lyrics here -->
                </div>
            </div>

            <!-- RIGHT ARROW -->
            <button id="btn-next" class="nav-arrow right">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="9 18 15 12 9 6"></polyline>
                </svg>
            </button>
        </main>

        <!-- FOOTER -->
        <footer class="presentation-footer">
            <div id="pagination-dots" class="pagination-dots">
                <!-- Dots generated by JS -->
            </div>
        </footer>

        <!-- HOME BTN -->
        <button id="btn-home" class="floating-home-btn">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                <polyline points="9 22 9 12 15 12 15 22"></polyline>
            </svg>
        </button>
    </div>

    <script src="renderer.js"></script>
</body>

</html>
